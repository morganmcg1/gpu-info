[project]
name = "gpu-info-extractor"
version = "0.1.0"
description = "Extracts insights from GPU programming YouTube videos using Gemini and Chain of Density."
requires-python = ">=3.13"
dependencies = [
    "google-genai",
    "python-dotenv>=1.0.1",
    "pytube>=15.0.0",
    "colorama>=0.4.6", # For colored terminal output on Windows
    "markdown",
    "python-dotenv"
]

[project.scripts]
process-video = "main:main"

[tool.uv]
# Settings for uv can be added here if needed in the future
