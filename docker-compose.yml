version: '3'

services:
  web:
    build: .
    ports:
      - "12000:12000"
    volumes:
      - ./summaries:/app/summaries
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped

  processor:
    build: .
    volumes:
      - ./summaries:/app/summaries
      - ./video_list.txt:/app/video_list.txt
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    command: python batch_process_videos.py --video_list video_list.txt --output_dir summaries --max_workers 1
    restart: "no"